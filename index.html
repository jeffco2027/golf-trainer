<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golf Trainer">
<title>Golf Pause Trainer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; background: #0c0c0a; color: #f0f0ed; min-height: 100vh; }
  .app { padding: 1.25rem; max-width: 480px; margin: 0 auto; padding-bottom: 2rem; }
  .logo-hero { display: flex; flex-direction: column; align-items: center; padding: 0.5rem 0 0.75rem; gap: 4px; }
  .logo-hero img { height: 120px; width: auto; display: block; }
  .logo-title { font-size: 24px; font-weight: 800; color: #1EB87F; letter-spacing: 2px; line-height: 1; }
  .logo-rule { width: 100%; height: 0.5px; background: #1EB87F; opacity: 0.2; margin: 3px 0; max-width: 220px; }
  .logo-sub { font-size: 10px; font-weight: 300; color: #1EB87F; letter-spacing: 5px; opacity: 0.65; }
  .logo-tagline { font-size: 9px; font-style: italic; color: #444; margin-top: 1px; }
  .stat-row { display: flex; gap: 10px; margin-bottom: 1rem; }
  .stat { flex: 1; background: #161614; border-radius: 10px; border: 0.5px solid #222220; padding: 0.75rem; text-align: center; }
  .stat .n { font-size: 22px; font-weight: 700; color: #f0f0ed; }
  .stat .l { font-size: 10px; color: #444; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
  .status-box { background: #161614; border: 0.5px solid #222220; border-radius: 14px; padding: 1.5rem; text-align: center; min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 0.75rem; }
  .cue-label { font-size: 38px; font-weight: 700; color: #f0f0ed; letter-spacing: 0.01em; }
  .cue-sub { font-size: 13px; color: #444; margin-top: 6px; }
  .timer-bar { height: 4px; background: #1e1e1c; border-radius: 2px; margin-bottom: 1rem; overflow: hidden; }
  .timer-fill { height: 100%; width: 0%; border-radius: 2px; background: #1EB87F; transition: width 0.1s linear; }
  .btn-row { display: flex; gap: 10px; margin-bottom: 1rem; }
  .btn { flex: 1; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; -webkit-tap-highlight-color: transparent; border: none; }
  .btn:active { transform: scale(0.97); }
  .btn.go { background: #1EB87F; color: #000; }
  .btn.go:active { background: #17946a; }
  .btn.go.active { background: #A32D2D; color: #fff; }
  .btn.go.active:active { background: #7a2020; }
  .btn.reset { background: #161614; color: #555; border: 0.5px solid #252523; }
  .btn.reset:active { background: #1e1e1c; }
  .card { background: #161614; border: 0.5px solid #222220; border-radius: 14px; padding: 1.25rem; margin-bottom: 1rem; }
  .card h2 { font-size: 10px; font-weight: 700; color: #444; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 0.75rem; }
  .row:last-child { margin-bottom: 0; }
  .row label { font-size: 14px; color: #888; min-width: 120px; }
  .row .val { font-size: 14px; font-weight: 600; min-width: 46px; text-align: right; color: #f0f0ed; }
  input[type=range] { flex: 1; -webkit-appearance: none; height: 4px; background: #252523; border-radius: 2px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #1EB87F; cursor: pointer; box-shadow: 0 0 6px rgba(30,184,127,0.4); }
  .phase-info { font-size: 11px; color: #444; text-align: center; margin-top: -0.5rem; margin-bottom: 0.75rem; }
  .marker-row { display: flex; align-items: center; gap: 8px; margin: -4px 0 10px 0; }
  .marker-line { flex: 1; height: 1px; background: #1EB87F; opacity: 0.25; }
  .marker-label { font-size: 10px; color: #1EB87F; font-weight: 600; white-space: nowrap; opacity: 0.7; }
  .prog-card { border: 2px solid #1EB87F !important; background: #0f1f18 !important; }
  .prog-card h2 { color: #1EB87F !important; opacity: 0.7; }
  .week-select-wrap { position: relative; }
  .week-select { width: 100%; padding: 11px 14px; border-radius: 9px; font-size: 14px; font-weight: 700; border: 1.5px solid #1EB87F; background: #091510; color: #1EB87F; -webkit-appearance: none; appearance: none; cursor: pointer; }
  .week-select-wrap::after { content: '\25be'; position: absolute; right: 13px; top: 50%; transform: translateY(-50%); color: #1EB87F; font-size: 14px; pointer-events: none; }
  .prog-detail { margin: 0.75rem 0 0.25rem; }
  .prog-goal-phrase { font-size: 12px; color: #1EB87F; font-style: italic; font-weight: 500; margin-bottom: 0.75rem; padding: 8px 10px; background: #091510; border-radius: 7px; }
  .prog-settings { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 0.6rem; }
  .prog-setting { background: #0c0c0a; border-radius: 6px; padding: 6px 8px; border: 0.5px solid #222220; }
  .prog-setting-label { font-size: 10px; color: #444; margin-bottom: 1px; }
  .prog-setting-val { font-size: 13px; font-weight: 600; color: #1EB87F; }
  .prog-load-btn { width: 100%; padding: 11px; border: 1.5px solid #1EB87F; border-radius: 8px; background: #0f1f18; font-size: 13px; font-weight: 700; color: #1EB87F; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .prog-load-btn:active { background: #17341f; }
  .prog-load-btn.goal-btn { background: #1EB87F; color: #000; border-color: #1EB87F; }
  .prog-load-btn.goal-btn:active { background: #17946a; }
  .test-btn { width: 100%; padding: 11px; border: 0.5px solid #252523; border-radius: 9px; background: transparent; font-size: 13px; font-weight: 600; color: #555; cursor: pointer; margin-top: 0.5rem; -webkit-tap-highlight-color: transparent; }
  .test-btn:active { background: #1a1a18; color: #888; }
</style>
</head>
<body>
<div class="app">

  <div class="logo-hero">
    <img src="golfer_green.png" alt="Golf Pause Trainer"/>
    <div class="logo-title">GOLF PAUSE</div>
    <div class="logo-rule"></div>
    <div class="logo-sub">TRAINER</div>
    <div class="logo-tagline">pause at the top &middot; lower body leads</div>
  </div>

  <div class="stat-row">
    <div class="stat"><div class="n" id="swingCount">0</div><div class="l">swings</div></div>
    <div class="stat"><div class="n" id="avgPause">&mdash;</div><div class="l">avg pause</div></div>
    <div class="stat"><div class="n" id="sessionMin">0:00</div><div class="l">session</div></div>
  </div>

  <div class="status-box">
    <div class="cue-label" id="cueLabel">Ready</div>
    <div class="cue-sub" id="cueSub">Press Start to begin</div>
  </div>

  <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>

  <div class="btn-row">
    <button class="btn go" id="startBtn" onclick="toggleSession()">Start</button>
    <button class="btn reset" onclick="resetStats()">Reset</button>
  </div>

  <div class="card prog-card">
    <h2>21/7 tempo progression</h2>
    <div class="week-select-wrap">
      <select class="week-select" id="weekPicker" onchange="onWeekPicked()">
        <option value="1">Week 1 &mdash; Feel the pause</option>
        <option value="2">Week 2 &mdash; Shorten and commit</option>
        <option value="3">Week 3 &mdash; Approach the tempo</option>
        <option value="4">Week 4 &mdash; Lock it in</option>
        <option value="5">Week 5 &mdash; 21/7 tempo &#9971;</option>
      </select>
    </div>
    <div class="prog-detail" id="weekDetail">
      <div class="prog-goal-phrase" id="weekPhrase"></div>
      <div class="prog-settings" id="weekSettings"></div>
    </div>
    <button class="prog-load-btn" id="weekLoadBtn" onclick="loadSelectedWeek()">Load week 1 settings</button>
  </div>

  <div class="card">
    <h2>Timing</h2>
    <div class="row"><label>Interval (min)</label><input type="range" id="backMin" min="3" max="12" step="0.5" value="5" oninput="updateSliders()"><span class="val" id="backMinVal">5s</span></div>
    <p class="phase-info" id="intervalDesc">Prompts every 5 &ndash; 8s (random)</p>
    <div class="marker-row"><span class="marker-line"></span><span class="marker-label">&#9971; 21/7 target: 6s</span></div>
    <div class="row"><label>Pause duration</label><input type="range" id="pauseDur" min="0.5" max="3" step="0.25" value="1" oninput="updateSliders()"><span class="val" id="pauseVal">1.0s</span></div>
    <div class="marker-row"><span class="marker-line"></span><span class="marker-label">&#9971; 21/7 target: 0.5s</span></div>
    <div class="row"><label>Pause randomness</label><input type="range" id="pauseRand" min="0" max="1" step="0.25" value="0.5" oninput="updateSliders()"><span class="val" id="pauseRandVal">&plusmn;0.5s</span></div>
    <div class="marker-row"><span class="marker-line"></span><span class="marker-label">&#9971; 21/7 target: &plusmn;0.25s</span></div>
  </div>

  <button class="test-btn" onclick="testCues()">&#9654; Test claps</button>

</div>
<script>
let running=false,phaseTimer=null,fillAnim=null,sessionTimer=null;
let sessionSec=0,swings=0,pauseTotal=0,fillStart=null,fillDuration=0;

const WEEKS={
  1:{interval:7,pause:2.0,rand:1.0,phrase:'"Just notice the transition \u2014 every swing is different"'},
  2:{interval:7,pause:1.25,rand:0.75,phrase:'"Cut the pause in half \u2014 load the lower body before firing"'},
  3:{interval:6,pause:0.75,rand:0.5,phrase:'"Getting close \u2014 build consistency in the transition"'},
  4:{interval:6,pause:0.5,rand:0.35,phrase:'"Almost there \u2014 consolidate before the final step"'},
  5:{interval:6,pause:0.5,rand:0.25,phrase:'"Tour tempo \u2014 3:1 ratio, lower body leads every time"'}
};

function onWeekPicked(){
  const n=parseInt(document.getElementById('weekPicker').value);
  const w=WEEKS[n];
  document.getElementById('weekPhrase').textContent=w.phrase;
  const s=document.getElementById('weekSettings');
  s.innerHTML='<div class="prog-setting"><div class="prog-setting-label">Interval</div><div class="prog-setting-val">'+w.interval+'s</div></div>'
    +'<div class="prog-setting"><div class="prog-setting-label">Pause</div><div class="prog-setting-val">'+w.pause+'s</div></div>'
    +'<div class="prog-setting"><div class="prog-setting-label">Randomness</div><div class="prog-setting-val">\u00b1'+w.rand+'s</div></div>';
  const btn=document.getElementById('weekLoadBtn');
  const isGoal=n===5;
  btn.textContent=isGoal?'\u26f3 Load 21/7 tempo settings':'Load week '+n+' settings';
  if(isGoal){btn.classList.add('goal-btn');}else{btn.classList.remove('goal-btn');}
}

function loadSelectedWeek(){
  const n=parseInt(document.getElementById('weekPicker').value);
  const w=WEEKS[n];
  document.getElementById('backMin').value=w.interval;
  document.getElementById('pauseDur').value=w.pause;
  document.getElementById('pauseRand').value=w.rand;
  updateSliders();
  const btn=document.getElementById('weekLoadBtn');
  const orig=btn.textContent;
  btn.textContent='\u2713 Loaded!';
  setTimeout(()=>{btn.textContent=orig;},1800);
}

let audioCtx=null;
function getAudioCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}
function makeClap(ctx,pitch,decay){
  const bufSize=Math.floor(ctx.sampleRate*0.18);
  const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++)data[i]=(Math.random()*2-1);
  const source=ctx.createBufferSource();
  source.buffer=buf;
  const filter=ctx.createBiquadFilter();
  filter.type='bandpass';filter.frequency.value=pitch;filter.Q.value=0.8;
  const gain=ctx.createGain();
  gain.gain.setValueAtTime(1.0,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+decay);
  source.connect(filter);filter.connect(gain);gain.connect(ctx.destination);
  source.start(ctx.currentTime);source.stop(ctx.currentTime+decay+0.02);
}
function speak(text){
  const t=text.toLowerCase();
  if(t==='back')makeClap(getAudioCtx(),1000,0.14);
  else if(t==='pause')makeClap(getAudioCtx(),1000,0.14);
  else makeClap(getAudioCtx(),1000,0.14);
}

function updateSliders(){
  const bMin=parseFloat(document.getElementById('backMin').value);
  const bMax=Math.min(bMin+3,18);
  document.getElementById('backMinVal').textContent=bMin+'s';
  document.getElementById('intervalDesc').textContent='Prompts every '+bMin+' \u2013 '+bMax+'s (random)';
  document.getElementById('pauseVal').textContent=parseFloat(document.getElementById('pauseDur').value).toFixed(2).replace(/\.?0+$/,'')+'s';
  const pr=parseFloat(document.getElementById('pauseRand').value);
  document.getElementById('pauseRandVal').textContent='\u00b1'+pr.toFixed(2).replace(/\.?0+$/,'')+'s';
}

function setDisplay(label,sub,color){document.getElementById('cueLabel').textContent=label;document.getElementById('cueSub').textContent=sub;document.getElementById('cueLabel').style.color=color||'#f0f0ed';}
function animateFill(duration,color){
  clearInterval(fillAnim);
  const fill=document.getElementById('timerFill');
  fill.style.background=color||'#1EB87F';fill.style.width='0%';
  fillStart=Date.now();fillDuration=duration;
  fillAnim=setInterval(()=>{const pct=Math.min(100,((Date.now()-fillStart)/fillDuration)*100);fill.style.width=pct+'%';if(pct>=100)clearInterval(fillAnim);},50);
}
function rand(min,max){return min+Math.random()*(max-min);}

function scheduleNext(){
  if(!running)return;
  const bMin=parseFloat(document.getElementById('backMin').value);
  const waitSec=rand(bMin,bMin+3);
  setDisplay('Ready','Waiting\u2026 address the ball','#444');
  animateFill(waitSec*1000,'#1EB87F');
  phaseTimer=setTimeout(()=>doBackswing(),waitSec*1000);
}
function doBackswing(){
  if(!running)return;
  setDisplay('Back','Start your backswing','#1EB87F');
  speak('back');animateFill(1200,'#1EB87F');
  phaseTimer=setTimeout(()=>doPause(),1200);
}
function doPause(){
  if(!running)return;
  const base=parseFloat(document.getElementById('pauseDur').value);
  const r=parseFloat(document.getElementById('pauseRand').value);
  const pauseSec=Math.max(0.3,base+rand(-r,r));
  pauseTotal+=pauseSec;
  setDisplay('Pause','Top of swing \u2014 hold it!','#EF9F27');
  speak('pause');animateFill(pauseSec*1000,'#EF9F27');
  phaseTimer=setTimeout(()=>doDownswing(),pauseSec*1000);
}
function doDownswing(){
  if(!running)return;
  swings++;
  setDisplay('Swing','Lower body leads \u2014 fire!','#E24B4A');
  speak('swing');
  document.getElementById('swingCount').textContent=swings;
  document.getElementById('avgPause').textContent=(pauseTotal/swings).toFixed(1)+'s';
  animateFill(700,'#E24B4A');
  phaseTimer=setTimeout(()=>scheduleNext(),900);
}
function toggleSession(){running?stopSession():startSession();}
function startSession(){
  getAudioCtx();
  running=true;
  document.getElementById('startBtn').textContent='Stop';
  document.getElementById('startBtn').classList.add('active');
  sessionTimer=setInterval(()=>{sessionSec++;const m=Math.floor(sessionSec/60),s=sessionSec%60;document.getElementById('sessionMin').textContent=m+':'+(s<10?'0':'')+s;},1000);
  scheduleNext();
}
function stopSession(){
  running=false;clearTimeout(phaseTimer);clearInterval(fillAnim);clearInterval(sessionTimer);
  document.getElementById('startBtn').textContent='Start';
  document.getElementById('startBtn').classList.remove('active');
  document.getElementById('timerFill').style.width='0%';
  setDisplay('Stopped','Session paused','#444');
}
function resetStats(){
  stopSession();swings=0;pauseTotal=0;sessionSec=0;
  document.getElementById('swingCount').textContent='0';
  document.getElementById('avgPause').textContent='\u2014';
  document.getElementById('sessionMin').textContent='0:00';
  setDisplay('Ready','Press Start to begin','#f0f0ed');
}
function testCues(){
  speak('back');
  setTimeout(()=>speak('pause'),1300);
  setTimeout(()=>speak('swing'),2400);
}
updateSliders();
onWeekPicked();
</script>
</body>
</html>
